name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Regenerate fixtures and diff against committed copies
        shell: bash
        run: |
          cargo run --example gen_fixture
          git diff --exit-code -- fixtures || (echo "::error::fixtures/ is stale — run 'cargo run --example gen_fixture' and commit the result" && exit 1)
      - name: Test (default features)
        run: cargo test --verbose
      - name: Test (tui feature)
        run: cargo test --verbose --features tui
      - name: Build (live-capture feature, Linux only)
        if: runner.os == 'Linux'
        run: cargo build --verbose --features live-capture

  lint:
    name: lint (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt
        run: cargo fmt -- --check
      - name: clippy (default features)
        run: cargo clippy --all-targets -- -D warnings
      - name: clippy (tui feature)
        run: cargo clippy --all-targets --features tui -- -D warnings
      - name: clippy (live-capture feature)
        run: cargo clippy --all-targets --features live-capture -- -D warnings

  coverage:
    name: coverage (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2
      - name: Generate coverage
        run: cargo llvm-cov --features tui --lib --tests --summary-only
